<!DOCTYPE html>
<html lang="en">

    <head>
        <link href="/pirenily-2024/static/favicon.ico" rel="icon">
        <link href="/pirenily-2024/static/styles.css" rel="stylesheet">
        <title>Pirenily</title>
        <script type="text/javascript">
            // Change the placeholder text every 3 seconds
            function changePlaceholder() {
                const items = ["Pirenily", "Chi Le", "Iron Pig", "Emily", "Chi Bell"];
                const inputField = document.getElementById("newtodo");
                let index = 0;

                // Update placeholder in an interval
                setInterval(() => {
                    inputField.placeholder = items[index];
                    index = (index + 1) % items.length; // Loop through the array
                }, 400); // 3 seconds interval
            }

            // Automatically submit form on Enter key press
            function setupFormSubmit() {
                const inputField = document.getElementById("newtodo");
                inputField.addEventListener("keypress", function(event) {
                    if (event.key === "Enter") {
                        event.preventDefault(); // Prevent default form submission
                        this.form.submit(); // Submit the form programmatically
                    }
                });
            }

            // Ensure all scripts run after the DOM is loaded
            window.onload = function() {
                changePlaceholder();
                setupFormSubmit();
            };
        </script>
    <script>
document.addEventListener("DOMContentLoaded", function () {
    const form = document.querySelector("form");
    const pages = ["about", "client", "collab", "personal", "street", "olympics", "highlander", "illustration", "recit", "superface"];
    const groups = [
        [["chi", "pirenily", "me", "chi le", "emily", "iron pig", "chi bell", "myself", "i", "artist"], "about"],
        [["commission", "client work", "commissioned work", "commissions", "client"], "client"],
        [["collaborative work", "collaborations", "collaboration", "member", "film", "direction", "director"], "collab"],
        [["personal work", "self", "person", "mine", "free", "journey"], "personal"],
    ];
    const random = ["about", "client", "collab", "personal", "illustration", "portal", "recit", "street"];
    form.addEventListener("submit", function (e) {
        e.preventDefault();
        const q = form.finder.value.toLowerCase();
        let page = pages.includes(q) ? q : null;
        for (const [words, target] of groups) if (!page && words.includes(q)) page = target;
        if (!page) page = random[Math.floor(Math.random() * random.length)];
        location.href = "/pirenily-2024/" + page;
    });
});
</script>
</head>

    <body>
        <nav>
            <div class="nav-item-big" align="center">
                <a class="nav-item" href="about"> About </a>
                <a class="nav-item" href="collab"> Collaborative Work </a>
                <a class="nav-item" href="personal"> Personal Work </a>
                <a class="nav-item" href="client"> Commissions </a>
            </div>
        </nav>

        <div id="video-container">
            <!--- Video will be used if the screen is big enough, otherwise a static image --->
            <video autoplay muted loop id="background-video">
                <source src="/pirenily-2024/static/asset/images/other/BG.mp4" type="video/mp4">
            </video>
        </div>

        <!--- Pseudonavigator that takes visitor to a random page if input string does not match any known page well enough --->
        <form method="POST">
            <input autocomplete="off" type="text" class="header" id="newtodo" placeholder="Pirenily" name="finder">
        </form>

        <footer>
            Chi (Tue) Le | Pirenily | Updated 2024
        </footer>
    </body>

</html>
