    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const loader = document.querySelector('.loader-container');
            const images = document.querySelectorAll('.masonry img'); // Select all gallery images
            let loadedImagesCount = 0;

            function hideLoader() {
                setTimeout(() => {
                    loader.classList.add('hidden'); // Hide loader after all images load
                }, 400); // Ensures the loader stays visible for at least 0.4s
            }

        // Check if all images are loaded
            images.forEach((img) => {
                if (img.complete && img.naturalHeight !== 0) {
                    loadedImagesCount++;
                } else {
                    img.addEventListener('load', () => {
                        loadedImagesCount++;
                        if (loadedImagesCount === images.length) {
                            hideLoader(); // Hide loader once all images are loaded
                        }
                    });

                    img.addEventListener('error', () => {
                        console.error(`Failed to load image: ${img.src}`);
                        loadedImagesCount++;
                        if (loadedImagesCount === images.length) {
                            hideLoader(); // Hide loader even if some images fail to load
                        }
                    });
                }
            });

        // If all images are already loaded
            if (loadedImagesCount === images.length) {
                hideLoader();
            }

        // Lightbox functionality
            const lightboxOverlay = document.createElement("div");
            lightboxOverlay.classList.add("lightbox-overlay");

            const img = document.createElement("img");
            lightboxOverlay.appendChild(img);

            const closeBtn = document.createElement("span");
            closeBtn.classList.add("close-btn");
            closeBtn.innerHTML = "&times;";
            lightboxOverlay.appendChild(closeBtn);

            document.body.appendChild(lightboxOverlay);

            const lightboxLinks = document.querySelectorAll(".lightbox");
            lightboxLinks.forEach((link) => {
                link.addEventListener("click", (e) => {
                    e.preventDefault();
                    img.src = link.href;
                    lightboxOverlay.style.display = "flex";
                });
            });

            closeBtn.addEventListener("click", () => {
                lightboxOverlay.style.display = "none";
            });

            lightboxOverlay.addEventListener("click", (e) => {
                if (e.target === lightboxOverlay) {
                    lightboxOverlay.style.display = "none";
                }
            });
        });
    </script>

        <script>
            // Script for the loader to load on every new page for at least 0.4s
            document.addEventListener("DOMContentLoaded", () => {
                const loader = document.querySelector('.loader-container');

                function showLoader() {
                    loader.classList.remove('hidden');
                }

                function hideLoader() {
                    setTimeout(() => {
                        loader.classList.add('hidden');
                    }, 400); // Minimum delay to show the loader
                }

                document.querySelectorAll('a').forEach(link => {
                    link.addEventListener('click', (e) => {
                        const url = link.getAttribute('href');

                        // Skip lightbox links
                        if (link.classList.contains('lightbox')) {
                            return; // Ignore loader for lightbox
                        }

                        // Check if the link is internal (same origin or relative URL)
                        const isInternal = url && (url.startsWith('/') || url.startsWith(window.location.origin));

                        if (isInternal) {
                            showLoader();
                        } else {
                            e.preventDefault(); // Optional: prevent external links from triggering loader
                            window.location.href = url; // Redirect to external site without showing the loader
                        }
                    });
                });

                // Hide the loader after the page fully loads
                window.addEventListener('load', hideLoader);

                // Reset the loader when navigating back
                window.addEventListener('pageshow', (event) => {
                    if (event.persisted) {
                        loader.classList.add('hidden');
                    }
                });
            });
        </script>
